<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>JPG + ZIP 合成工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- JSZip CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      padding: 20px;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2>JPG + ZIP 文件合成</h2>

  <input type="file" id="fileInput" multiple />
  <br />

  <button id="mergeBtn">合成并下载 JPG</button>

  <script>
    // 预留的 JPG 图片地址
    const BASE_JPG_URL = "https://example.com/base.jpg";

    const fileInput = document.getElementById("fileInput");
    const mergeBtn = document.getElementById("mergeBtn");

    mergeBtn.onclick = async () => {
      const files = fileInput.files;
      if (!files.length) {
        alert("请先选择文件");
        return;
      }

      try {
        /* 1. 生成 ZIP */
        const zip = new JSZip();
        for (const file of files) {
          zip.file(file.name, file);
        }
        const zipBuffer = await zip.generateAsync({ type: "arraybuffer" });

        /* 2. 获取 JPG 二进制 */
        const jpgResp = await fetch(BASE_JPG_URL);
        if (!jpgResp.ok) throw new Error("JPG 加载失败");
        const jpgBuffer = await jpgResp.arrayBuffer();

        /* 3. 拼接二进制 */
        const merged = new Uint8Array(
          jpgBuffer.byteLength + zipBuffer.byteLength
        );
        merged.set(new Uint8Array(jpgBuffer), 0);
        merged.set(new Uint8Array(zipBuffer), jpgBuffer.byteLength);

        /* 4. 生成 Blob */
        const blob = new Blob([merged], { type: "image/jpeg" });
        const url = URL.createObjectURL(blob);

        /* 5. 自动下载 */
        const a = document.createElement("a");
        a.href = url;
        a.download = "merged.jpg";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

      } catch (e) {
        console.error(e);
        alert("合成失败：" + e.message);
      }
    };
  </script>

</body>
</html>
