<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.12);
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --focus: rgba(37, 99, 235, 0.28);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: radial-gradient(1200px 500px at 20% 10%, rgba(37, 99, 235, 0.10), transparent 60%),
                  radial-gradient(900px 420px at 80% 0%, rgba(99, 102, 241, 0.10), transparent 60%),
                  var(--bg);
      padding: 24px;
      display: grid;
      place-items: center;
    }

    .panel {
      width: min(680px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 20px;
      letter-spacing: 0.2px;
    }

    .controls {
      display: grid;
      gap: 14px;
    }

    input[type="file"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      background: rgba(15, 23, 42, 0.02);
      color: var(--muted);
      outline: none;
    }

    input[type="file"]:focus,
    input[type="file"]:focus-visible {
      border-color: rgba(37, 99, 235, 0.55);
      box-shadow: 0 0 0 4px var(--focus);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.2px;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
      box-shadow: 0 10px 18px rgba(37, 99, 235, 0.20);
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.16);
    }

    button:focus,
    button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--focus), 0 10px 18px rgba(37, 99, 235, 0.20);
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
      button:hover { transform: none; }
    }
  </style>
</head>
<body>

  <div class="panel">
    <h2>图片合成工具</h2>

    <div class="controls">
      <input type="file" id="fileInput" multiple />
      <button id="mergeBtn">合成并下载 JPG</button>
    </div>
  </div>

/* Base64 → Uint8Array */
function base64ToUint8Array(base64) {
  base64 = base64.replace(/^data:image\/jpeg;base64,/, "");
  const binary = atob(base64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

const fileInput = document.getElementById("fileInput");
const mergeBtn = document.getElementById("mergeBtn");

mergeBtn.onclick = async () => {
  const files = fileInput.files;
  if (!files.length) {
    alert("请先选择文件");
    return;
  }

  try {
    /* 1. 打 ZIP */
    const zip = new JSZip();
    for (const file of files) {
      zip.file(file.name, file);
    }
    const zipBuffer = await zip.generateAsync({ type: "arraybuffer" });

    /* 2. Base64 JPG → bytes */
    const jpgBytes = base64ToUint8Array(BASE_JPG_BASE64);

    /* 3. 二进制拼接（JPG + ZIP） */
    const merged = new Uint8Array(jpgBytes.length + zipBuffer.byteLength);
    merged.set(jpgBytes, 0);
    merged.set(new Uint8Array(zipBuffer), jpgBytes.length);

    /* 4. 生成 Blob 并下载 */
    const blob = new Blob([merged], { type: "image/jpeg" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "merged.jpg";
    document.body.appendChild(a);
    a.click();

    document.body.removeChild(a);
    URL.revokeObjectURL(url);

  } catch (e) {
    console.error(e);
    alert("合成失败：" + e.message);
  }
};
</script>
