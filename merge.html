<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>JPG + ZIP 合成（iOS 相册适配）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    :root {
      --el-color-primary: #409eff;
      --el-color-primary-light-9: #ecf5ff;
      --el-text-color-primary: #303133;
      --el-text-color-regular: #606266;
      --el-text-color-secondary: #909399;
      --el-border-color: #dcdfe6;
      --el-border-color-light: #e4e7ed;
      --el-fill-color-light: #f5f7fa;
      --el-bg-color: #ffffff;
      --el-bg-color-page: #f5f6fa;

      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      color: var(--el-text-color-primary);
      background:
        radial-gradient(1200px 600px at 20% 0%, rgba(64, 158, 255, 0.10), rgba(64, 158, 255, 0) 55%),
        var(--el-bg-color-page);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .card {
      width: min(720px, 100%);
      background: var(--el-bg-color);
      border: 1px solid var(--el-border-color-light);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 22px;
      border-bottom: 1px solid var(--el-border-color-light);
      background: linear-gradient(135deg, #ffffff 0%, var(--el-color-primary-light-9) 100%);
    }

    .title {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .subtitle {
      margin: 0;
      font-size: 13px;
      color: var(--el-text-color-regular);
      line-height: 1.6;
    }

    .card-inner { padding: 22px; }

    .form {
      display: grid;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .label {
      font-size: 13px;
      color: var(--el-text-color-secondary);
    }

    .file-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--el-border-color);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--el-text-color-regular);
      box-shadow: var(--shadow-sm);
      outline: none;
    }

    .file-input:hover { border-color: #c0c4cc; }

    .file-input:focus-visible {
      border-color: var(--el-color-primary);
      box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.18);
    }

    .file-input::file-selector-button {
      margin-right: 10px;
      padding: 8px 12px;
      border: 1px solid var(--el-border-color);
      border-radius: 10px;
      background: var(--el-fill-color-light);
      color: var(--el-text-color-regular);
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.14s ease;
    }

    .file-input::file-selector-button:hover {
      background: #eef2f6;
      border-color: #c0c4cc;
      transform: translateY(-1px);
    }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.14s ease, box-shadow 0.18s ease, background 0.18s ease;
      user-select: none;
      line-height: 1.1;
    }

    .btn-primary {
      background: var(--el-color-primary);
      color: #fff;
      box-shadow: 0 8px 18px rgba(64, 158, 255, 0.26);
      min-width: 110px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(64, 158, 255, 0.32);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(64, 158, 255, 0.24);
    }

    .hint {
      margin: 0;
      font-size: 12px;
      color: var(--el-text-color-secondary);
      line-height: 1.6;
    }

    .footer {
      margin-top: 14px;
      font-size: 12px;
      color: var(--el-text-color-secondary);
      text-align: center;
      opacity: 0.9;
    }

    @media (max-width: 520px) {
      .card-inner { padding: 16px; }
      .header { padding: 16px; }
      .title { font-size: 18px; }
      .btn-primary { width: 100%; }
    }
  </style>
</head>
<body>

  <main class="page">
    <section class="card" aria-label="JPG + ZIP 合成">
      <header class="header">
        <h1 class="title">JPG + ZIP 合成</h1>
        <p class="subtitle">选择多个文件后合成为一张 JPG（iOS 直接打开后可“存储到照片”）。</p>
      </header>

      <div class="card-inner">
        <div class="form">
          <label class="field">
            <span class="label">选择要打包的文件（可多选）</span>
            <input class="file-input" type="file" id="fileInput" multiple />
          </label>

          <div class="actions">
            <button class="btn btn-primary" id="mergeBtn" type="button">合成</button>
          </div>

          <p class="hint">非 iOS 设备会直接下载为 <b>merged.jpg</b>。</p>
        </div>

        <div class="footer">本页面仅处理本地文件，不会上传。</div>
      </div>
    </section>
  </main>

/* Base64 → Uint8Array */
function base64ToUint8Array(base64) {
  base64 = base64.replace(/^data:image\/jpeg;base64,/, "");
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes;
}

/* iOS 判断 */
function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

const fileInput = document.getElementById("fileInput");
const mergeBtn = document.getElementById("mergeBtn");

mergeBtn.onclick = async () => {
  const files = fileInput.files;
  if (!files.length) {
    alert("请先选择文件");
    return;
  }

  try {
    /* 1. ZIP */
    const zip = new JSZip();
    for (const file of files) {
      zip.file(file.name, file);
    }
    const zipBuffer = await zip.generateAsync({ type: "arraybuffer" });

    /* 2. JPG bytes */
    const jpgBytes = base64ToUint8Array(BASE_JPG_BASE64);

    /* 3. 拼接 */
    const merged = new Uint8Array(jpgBytes.length + zipBuffer.byteLength);
    merged.set(jpgBytes, 0);
    merged.set(new Uint8Array(zipBuffer), jpgBytes.length);

    /* 4. Blob */
    const blob = new Blob([merged], { type: "image/jpeg" });
    const url = URL.createObjectURL(blob);

    if (isIOS()) {
      /**
       * iOS：
       * 直接打开图片
       * 用户点击“存储到照片”
       */
      window.location.href = url;
    } else {
      /**
       * 其他平台：
       * 直接下载
       */
      const a = document.createElement("a");
      a.href = url;
      a.download = "merged.jpg";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // 延迟释放，避免 iOS 打不开
    setTimeout(() => URL.revokeObjectURL(url), 10000);

  } catch (e) {
    console.error(e);
    alert("合成失败：" + e.message);
  }
};
</script>
